baseURL = "https://wereonlyalittlelost.com/"
languageCode = "en-us"
title = "We're Only a Little Lost"
theme = "lost_theme"
enableRobotsTXT = true

DefaultContentLanguage = "en"
SectionPagesMenu = "main"
Paginate = 10

[outputs]
  # JSON on the home page is the index the header search box reads.
  home = ["HTML", "RSS", "JSON"]

[params]
  favicon = "/images/favicon.png"
  tagline = "Pam and Co Travel Around California, the Country and Beyond!"
  description = "It's an adventure"
  youtube = "https://www.youtube.com/channel/UCx4SjesqsItUdbYmy_aJXzA"
  # choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-black"
  featured_image = "/images/cover_image.jpg"
  recent_posts_number = 4
  recent_copy = "Latest Posts"
  home = "Home"

# Google AdSense. `client` loads the AdSense script on every page; ad units only
# appear once the slot IDs below are filled in.
#   client:    your publisher ID, e.g. "ca-pub-1234567890123456"
#   slot_post: ad unit ID for the unit beside posts
#   slot_list: ad unit ID for the unit under trip and tag listings
# static/ads.txt carries the same publisher ID; keep the two in step.
[params.adsense]
  client = "ca-pub-2482294114571790"
  slot_post = ""
  slot_list = ""

[author]
  name = "Pam"