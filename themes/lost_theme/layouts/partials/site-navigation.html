<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l justify-between items-center center">
    <a href="{{ .Site.BaseURL }}" class="f3 fw2 hover-white no-underline white-90 dib">
      {{ .Site.Params.home }} 
    </a>
    <div class="flex-l items-center">
      {{ if .Site.Menus.main }}
        <ul class="pl0 mr3">
          {{ range .Site.Menus.main }}
          <li class="list f5 f4-ns fw4 dib pr3">
            <a class="hover-white no-underline white-90" href="{{ .URL }}" title="{{ .Name }} page">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      {{/* Hidden until assets/js/search.js runs, so readers without JS don't see a dead box. */}}
      <div class="site-search" data-search data-index="{{ "index.json" | relURL }}" hidden>
        <label class="clip" for="site-search-input">Search trips, tags and posts</label>
        <input id="site-search-input" type="search" placeholder="Search trips, tags, posts" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="site-search-results" aria-autocomplete="list">
        <div id="site-search-results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      {{ partialCached "social-follow.html" . }}
    </div>
  </div>
</nav>
